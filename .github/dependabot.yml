version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Pinned to 4.1.x: @stryker-mutator/vitest-runner 10.0.0 does not activate
      # runtime mutants under Vitest 5. See docs/decisions/0003-testing-strategy.md
      - dependency-name: vitest
        versions: [">=5"]
      - dependency-name: "@vitest/*"
        versions: [">=5"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
