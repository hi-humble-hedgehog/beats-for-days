name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Architecture boundaries
        run: pnpm deps:check
      - name: Dead code & unused dependencies
        run: pnpm knip
      - name: Tests + CRAP gate
        run: pnpm test:crap
      - name: Build
        run: pnpm build

      - name: Upload coverage & CRAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/
            reports/crap.json
          if-no-files-found: ignore

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Incremental mode: reuse results for unchanged code/tests.
      # PRs fall back to main's baseline on their first run.
      - name: Restore Stryker incremental baseline
        uses: actions/cache@v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            stryker-${{ github.head_ref || github.ref_name }}-
            stryker-main-

      - name: Run Stryker
        run: pnpm test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest git /repo --redact --no-banner --verbose
